<!DOCTYPE html>
<html>

    <head>
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
        <title>Bitcoin</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet"> </head>

    <body>
        <div class="card"> 
            <img src="bitcoin-image.png" alt="bitcoin">
            <div class="cardcontent">
                <h1 class="h1"> Bitcoin (BTC)</h1>
                <p>Bitcoin is a decentralized digital currency that can be transferred on the peer-to-peer bitcoin network.</p>
                <div class="carddetails">
                    <img class="icon" src="icon-bitcoin.png" alt="bitcoin-icon">
                    <div>
                        <h4>1 BTC Price</h4>
                        <h6>$54,961.62</h6>
                    </div>
                    <a href="">Change</a>
                </div>
                <button class="btn1">Buy 1-BTC</button>
                <button class="btn2">Cancel order</button>
            </div>
        </div>
    </body>
</html>
